---

- name: Ensure redis-tools are installed natively
  apt:
    name: "redis-tools"
    state: present
  become: true

- name: Pull redis-server image
  containers.podman.podman_image:
    name: "docker.io/library/redis:8.0.3"
    pull: true
    state: present

- name: Provide systemd service for redis-server container
  ansible.builtin.template:
    src: "systemd/redis.service.j2"
    dest: "/etc/systemd/system/redis-server.service"
    owner: root
    group: root
    mode: '0644'
  notify: "systemd | redis-server | restarted"
  become: true
